name: package-checks

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python examples/agent_integration.py
      - name: CLI withholds the conflicting synthetic draft
        run: |
          python - <<'PY'
          import json, subprocess
          run = subprocess.run(
              ["turn-grounding-guard", "--input", "examples/synthetic_input.json"],
              capture_output=True, text=True, check=False,
          )
          result = json.loads(run.stdout)
          assert run.returncode == 2, run
          assert result["status"] == "blocked" and result["reply"] is None, result
          PY
